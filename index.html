<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Fluid Caustics</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0e11; color: #cbd5e1;
        font-family: system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      header { padding: 8px 14px; font-size: 13px; letter-spacing: .04em;
        border-bottom: 1px solid #1e293b; }
      header b { color: #2dd4bf; }
      #stage { flex: 1; display: grid; place-items: center; }
      canvas { width: 640px; height: 640px; image-rendering: pixelated;
        border: 1px solid #1e293b; cursor: crosshair; }
      #hint { padding: 6px 14px; font-size: 12px; color: #64748b;
        border-top: 1px solid #1e293b; }
      #error { color: #f87171; padding: 14px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app">
      <header><b>Dynamic Fluid Caustics</b> — Phase 1: poke the surface, watch the caustic</header>
      <div id="stage"><canvas id="gpu-canvas" width="512" height="512"></canvas></div>
      <div id="hint">Click / drag on the canvas to poke the water surface. Reflective walls. Caustic accumulates on the floor plane.</div>
    </div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
