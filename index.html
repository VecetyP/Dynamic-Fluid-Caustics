<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Fluid Caustics</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0e11; color: #cbd5e1;
        font-family: system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      header { padding: 8px 14px; font-size: 13px; letter-spacing: .04em;
        border-bottom: 1px solid #1e293b; }
      header b { color: #2dd4bf; }
      #stage { flex: 1; display: flex; align-items: center; justify-content: center;
        gap: 28px; flex-wrap: wrap; }
      .pane { display: flex; flex-direction: column; gap: 8px; align-items: center; }
      .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: .08em; }
      canvas { border: 1px solid #1e293b; }
      #draw-canvas { width: 440px; height: 440px; background: #000; cursor: crosshair;
        touch-action: none; image-rendering: pixelated; }
      #gpu-canvas { width: 480px; height: 480px; }
      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
      .slider { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; }
      .slider input[type=range] { accent-color: #2dd4bf; width: 160px; }
      button { background: #14304a; color: #cbd5e1; border: 1px solid #245; border-radius: 6px;
        padding: 6px 12px; font-size: 13px; cursor: pointer; }
      button:hover { background: #1c3d5e; }
      button.primary { background: #0d5f57; border-color: #2dd4bf; color: #e8fffb; }
      #hint { padding: 6px 14px; font-size: 12px; color: #64748b; border-top: 1px solid #1e293b; }
      #error { color: #f87171; padding: 14px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app">
      <header><b>Dynamic Fluid Caustics</b> — sketch a target, watch the water focus light into it</header>
      <div id="stage">
        <div class="pane">
          <div class="label">1 · Draw a target</div>
          <canvas id="draw-canvas" width="256" height="256"></canvas>
          <div class="controls">
            <button id="solve-btn" class="primary">Solve → Caustic</button>
            <button id="demo-btn">Demo bump</button>
            <button id="clear-btn">Clear</button>
          </div>
        </div>
        <div class="pane">
          <div class="label">2 · Caustic on the tank floor</div>
          <canvas id="gpu-canvas" width="640" height="640"></canvas>
          <div class="controls">
            <label class="slider">Speed
              <input type="range" id="speed" min="0.3" max="4" step="0.05" value="1" />
            </label>
          </div>
        </div>
      </div>
      <div id="hint">Draw with the mouse, then Solve. The inverse solver computes a water
        surface and piston schedule; the caustic pulses into your shape.</div>
    </div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
